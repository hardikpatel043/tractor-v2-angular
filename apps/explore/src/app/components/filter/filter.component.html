<div class="e_Filter">
    Filter:
    <ul>
        @for (f of filters(); track $index) {
        @if (f.active) {
        <li class="e_Filter__filter--active">{{f.name}}</li>
        }@else{
        <li>
            <a [href]="f.url">{{f.name}}</a>
        </li>
        }
        }
    </ul>
</div>
