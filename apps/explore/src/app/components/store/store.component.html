<li class="e_Store">
    <div class="e_Store_content">
        <img class="e_Store_image" [src]="src(store.image,200)" [srcset]="srcset(store.image, [200, 400])" width="200"
            height="200" alt="" />
        <p class="e_Store_address">
            {{store.name}}
            <br />
            {{store.street}}
            <br />
            {{store.city}}
        </p>
    </div>
</li>
